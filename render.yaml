services:
  - type: web
    name: miabe-prospect-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: none
      - key: DATABASE_URL
        value: sqlite:///./prospectai.db
